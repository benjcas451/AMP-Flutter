name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze & test
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Existing lint infos are not fatal; warnings and errors fail the build.
      - run: flutter analyze --no-fatal-infos

      - run: flutter test
